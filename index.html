<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aetherfolk — Creature Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div id="stage">
  <div id="world">
    <canvas id="worldCanvas"></canvas>
    <div class="hud" id="hud">
      <div class="plate"><div id="hudRegion">Verdant Hollow</div><div class="badgestrip" id="hudBadges"></div></div>
      <div class="spacer"></div>
      <div class="plate" id="hudMoney">¢ 3000</div>
      <button class="iconbtn" id="menuBtn">MENU</button>
    </div>
    <div id="pad">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><span></span><button data-dir="right">▶</button>
      <span></span><button data-dir="down">▼</button><span></span>
    </div>
    <button id="actBtn" class="">A</button>
    <div id="dialogue">
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgChoices"></div>
    </div>
    <div id="battle">
      <div class="arena" id="arena">
        <div class="plat foe"></div><div class="plat ally"></div>
        <div class="slot foe" id="foeSlot"></div>
        <div class="slot ally" id="allySlot"></div>
        <div class="nameplate foe" id="foePlate"></div>
        <div class="nameplate ally" id="allyPlate"></div>
        <div class="battlemsg" id="battleBanner"></div>
      </div>
      <div id="battleUI">
        <div id="battleText">A wild creature appeared.</div>
        <div id="battleControls"></div>
      </div>
    </div>
    <div class="panel hidden" id="panel">
      <h2 id="panelTitle">Menu</h2>
      <div class="body" id="panelBody"></div>
      <div class="foot" id="panelFoot"></div>
    </div>
    <div id="loading">
      <div class="logo">AETHERFOLK</div>
      <div class="loadtrack"><i id="loadBar"></i></div>
      <div class="muted" id="loadNote">Loading art</div>
    </div>
    <div id="title" class="hidden">
      <div class="sprites" id="titleSprites"></div>
      <div class="credit">World art by <b>scarloxy</b> · CC BY 4.0 · <span>scarloxy.itch.io/mpwsp01</span></div>
      <div class="logo">AETHERFOLK</div>
      <div class="tag">Eight regions. Eight arenas. One hundred and fifty creatures waiting to be found.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary" id="newGameBtn">Start a new expedition</button>
        <button class="btn" id="continueBtn">Continue</button>
      </div>
      <div class="muted" style="font-size:14px">Arrows or WASD to walk · Space/Enter to interact · M for menu</div>
    </div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/creatures.js"></script>
<script src="js/model.js"></script>
<script src="js/world.js"></script>
<script src="js/interior.js"></script>
<script src="js/battle.js"></script>
<script src="js/game.js"></script>

</body>
</html>
